<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QTI Player Cookbook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    /* The shell is only a frame: a toolbar to pick an example and the example itself, which brings its own theme. */
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; font: 14px/1.4 system-ui, sans-serif; background: #fff; color: #1f2937; }
    header { display: flex; align-items: center; gap: 1rem; padding: 0 1rem; border-bottom: 1px solid #e5e7eb; background: #fafafa; }
    header h1 { margin: 0; font-size: 1rem; white-space: nowrap; }
    nav { display: flex; gap: 0.25rem; overflow-x: auto; }
    nav a { display: flex; align-items: center; gap: 0.4rem; padding: 0.85rem 0.75rem; color: inherit; text-decoration: none; white-space: nowrap; border-bottom: 3px solid transparent; }
    nav a:hover { background: #f1f5f9; }
    nav a[aria-current="page"] { border-bottom-color: #111827; font-weight: 600; }
    iframe { flex: 1; width: 100%; border: 0; }
  </style>
</head>

<body>
  <header>
    <h1>QTI Player Cookbook</h1>
    <nav id="examples" aria-label="Voorbeelden"></nav>
  </header>
  <iframe id="example" title="Voorbeeld"></iframe>

  <script type="module">
    // Every example is its own page in examples/<id>/ (own <qti-test> template, own theme.css, own QTI package).
    const examples = [
      { id: "formatief", icon: "lightbulb", label: "Formatief" },
      { id: "facet", icon: "layout-text-window", label: "Facet" },
      { id: "vraagtypen", icon: "ui-checks-grid", label: "Vraagtypen" },
      { id: "adaptief-toets", icon: "chat-dots", label: "Adaptief: toets" },
      { id: "adaptief-item", icon: "diagram-3", label: "Adaptief: item" },
      { id: "rekenen", icon: "calculator", label: "Rekenen" },
      { id: "examen", icon: "journal-text", label: "Examen" },
      { id: "examenkompas", icon: "compass", label: "Examenkompas" },
      { id: "wikiwijs", icon: "mortarboard", label: "Wikiwijs" },
      { id: "minimal", icon: "dash-square", label: "Minimaal" },
    ];
    const nav = document.querySelector("#examples");
    const frame = document.querySelector("#example");
    nav.innerHTML = examples.map(({ id, icon, label }) => `<a href="#/${id}" data-id="${id}"><i class="bi bi-${icon}"></i>${label}</a>`).join("");

    // #/<example>/<item> opens examples/<example>/#/<item>
    let shown;
    const show = () => {
      const [route, item] = location.hash.slice(2).split("/");
      const id = examples.some((e) => e.id === route) ? route : examples[0].id;
      nav.querySelectorAll("a").forEach((a) => (a.dataset.id === id ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")));
      document.title = `${examples.find((e) => e.id === id).label} · QTI Player Cookbook`;
      if (shown === id && !item) return;
      shown = id;
      frame.src = `examples/${id}/index.html${item ? `#/${item}` : ""}`;
    };
    window.addEventListener("hashchange", show);
    show();
  </script>
</body>

</html>
