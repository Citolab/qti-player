<!DOCTYPE html>
<html lang="nl" data-qti-theme="playful">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formatief</title>

  <!-- Tailwind with its preflight, as everyone uses it -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <!-- The page's tokens as Tailwind colors: bg-surface, text-ink, bg-brand, border-line, rounded-box, ... -->
  <style type="text/tailwindcss">
    @theme inline {
      --color-surface: var(--cito-color-base-100);
      --color-page: color-mix(in oklab, var(--cito-color-base-100), var(--cito-color-base-content) 2.5%);
      --color-line: color-mix(in oklab, var(--cito-color-base-100), var(--cito-color-base-content) 6%);
      --color-ink: var(--cito-color-base-content);
      --color-brand: var(--cito-color-primary);
      --color-on-brand: var(--cito-color-primary-content);
      --color-good: var(--cito-color-success);
      --color-warn: var(--cito-color-warning);
      --color-bad: var(--cito-color-error);
      --radius-box: var(--cito-radius-box, 0.5rem);
      --radius-field: var(--cito-radius-field, 0.25rem);
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;900&display=swap" rel="stylesheet" />

  <!-- Theme of this example: only the tier-1 tokens of the qti-components theme (qti-theme CONTRACT.md §8), all colours the page uses set explicitly.
       item.css derives the rest for the items; the Tailwind classes read these same --cito-* tokens, never the --qti-* ones. -->
  <style>
    /* Playful: white cards on a pale sky page, one clear blue for what is chosen, a green go-on button, generous rounding. */
    html[data-qti-theme="playful"] {
      color-scheme: light;
      --cito-color-base-100: oklch(100% 0 none);
      --cito-color-base-content: oklch(34% 0.04 255);
      --cito-color-primary: oklch(57% 0.17 245);
      --cito-color-primary-content: oklch(100% 0 none);
      --cito-color-neutral: oklch(62% 0.19 140);
      --cito-color-neutral-content: oklch(100% 0 none);
      --cito-color-chip: oklch(100% 0 none);
      --cito-color-chip-border: oklch(88% 0.02 250);
      --cito-color-border: oklch(78% 0.03 250);
      --cito-color-info: oklch(52% 0.16 265);
      --cito-color-success: oklch(55% 0.16 145);
      --cito-color-warning: oklch(72% 0.15 70);
      --cito-color-error: oklch(56% 0.2 25);
      --cito-radius-field: 0.75rem;
      --cito-radius-selector: 0.75rem;
      --cito-radius-box: 1.5rem;
      --cito-border-width: 2px;
      --cito-depth: 1;
      --cito-font-family: Nunito, "Avenir Next", system-ui, sans-serif;
    }
    /* The popover is the box: the rubric block inside it draws no box of its own (an unlayered rule, so it wins over the theme's layers) */
    #rubric qti-rubric-block { margin: 0; padding: 0; border: 0; background: none; }
    body { margin: 0; font-family: var(--cito-font-family); color: var(--cito-color-base-content);
      background: oklch(97.5% 0.02 235) radial-gradient(circle at 15% -10%, oklch(92% 0.06 235), transparent 45%); min-height: 100vh; }
  </style>

  <script type="module">
    import "@citolab/qti-components"; // registers the components
    import "@citolab/qti-components/item.css"; // the item theme: reads the --cito-* tokens set above

    // This page is the host. The components do the QTI; the host decides:
    //  - the look: the --cito-* tokens in the <style> above, and the markup around <test-container>
    //  - where instructions go: cito-item-rubric-placement (optional; here a popover over the page that the candidate closes; without it they show above the item, inside the card)
    //  - the state: test.state is restored and cito-test-state-changed is saved (here sessionStorage; a real host sends it to its backend)
    //  - the navigation: cito-test-navigated keeps the address bar in step, navigateTo opens a link
    //  - scoring: Nakijken (test-end-attempt) scores an item; the dialog shows an overview

    // Restore and deep link: the state (answers and position) is kept in sessionStorage, #/<id> opens that item
    const test = document.querySelector("qti-test"), KEY = "formatief";
    if (sessionStorage.getItem(KEY)) test.state = JSON.parse(sessionStorage.getItem(KEY));
    test.addEventListener("cito-test-state-changed", (e) => sessionStorage.setItem(KEY, JSON.stringify(e.detail)));
    // The first navigation opens the restored position; a link in the address bar wins over that
    let first = true;
    test.addEventListener("cito-test-navigated", (e) => {
      const wanted = first && location.hash.slice(2);
      first = false;
      if (wanted && wanted !== e.detail.id) test.navigateTo("item", wanted);
      else history.replaceState(null, "", `#/${e.detail.id}`);
    });
    // Instructions (qti-rubric-block class="qti-rubric-discretionary-placement") go above the item
    test.addEventListener("cito-item-rubric-placement", (e) => { const rubric = document.querySelector("#rubric"); rubric.append(e.detail.element); rubric.showPopover(); });
  </script>
</head>

<!--
  FORMATIEF: oefenen met directe feedback (linear + individual, 2 pogingen).
  Template: ronde stapjes onderin tonen de voortgang, een poging-teller, Nakijken en Volgende. Alles komt uit de QTI.
-->
<body>
  <qti-test navigate="item">
    <test-navigation class="mx-auto flex min-h-screen max-w-2xl flex-col gap-5 px-4 pt-8">
      <header class="flex items-center gap-4">
        <span class="grid size-14 place-items-center rounded-2xl bg-brand text-3xl text-on-brand shadow-[0_4px_0_oklch(45%_0.17_245)]"><i class="bi bi-pencil-fill"></i></span>
        <div>
          <h1 class="text-3xl font-black leading-tight">Werkwoordspelling</h1>
          <p class="text-ink/60">Oefen en leer van je fouten</p>
        </div>
      </header>

      <!-- The instructions: a popover (no code to close it), over the page, with a shadow under it -->
      <div id="rubric" popover="manual" role="note"
        class="fixed inset-auto left-1/2 top-4 m-0 w-[min(40rem,calc(100vw-2rem))] -translate-x-1/2 rounded-box border-0 bg-surface p-5 pr-12 text-ink shadow-[0_24px_60px_-12px_rgb(0_0_0/0.45)] [&_math]:text-[1.15em]">
        <button popovertarget="rubric" popovertargetaction="hide" aria-label="Sluiten"
          class="absolute right-3 top-3 grid size-8 cursor-pointer place-items-center rounded-full bg-page text-ink hover:bg-line"><i class="bi bi-x-lg"></i></button>
      </div>

      <test-container test-url="../../formatief/AssessmentTest.xml" class="block rounded-box bg-surface p-7 shadow-[0_6px_0_oklch(88%_0.03_250)]">
        <template>
          <style>
            /* Item feedback lives in the test's shadow root, so it is styled here with the page's tokens */
        qti-feedback-block { --fb: var(--cito-color-info); }
        qti-feedback-block.qti-feedback-correct { --fb: var(--cito-color-success); }
        qti-feedback-block.qti-feedback-hint { --fb: var(--cito-color-warning); }
        qti-feedback-block::part(feedback) {
          margin-top: 1rem; padding: 0.25rem 1rem;
          border-left: 4px solid var(--fb); border-radius: var(--cito-radius-field, 0.25rem);
          background: color-mix(in oklab, var(--fb) 12%, transparent);
        }
        qti-feedback-inline::part(feedback) {
          margin-inline: 0.5rem; padding: 0 0.5rem; font-size: 0.875em;
          border-radius: var(--cito-radius-field, 0.25rem); background: color-mix(in oklab, var(--cito-color-base-100), var(--cito-color-base-content) 2.5%);
        }
        math { font-size: 1.15em; math-style: normal; }
          </style>
        </template>
      </test-container>

      <!-- Nakijken: directly below the item, with the attempt it is on -->
      <test-stamp class="block">
        <template>
          <div class="flex flex-wrap items-center gap-3 px-1">
            <test-end-attempt>Nakijken</test-end-attempt>
            <test-next>Volgende</test-next>
            <span class="text-sm font-bold text-ink/60">Poging {{ activeItem.numAttempts }} van {{ activeItem.maxAttempts > 0 ? activeItem.maxAttempts : '∞' }}</span>
            <template type="if" if="{{ activeItem.numAttempts > 0 && activeItem.optimal }}">
              <span class="rounded-full bg-good/15 px-3 py-1 text-sm font-semibold text-good"><i class="bi bi-check-lg me-1"></i>Goed</span>
            </template>
            <template type="if" if="{{ activeItem.numAttempts > 0 && !activeItem.optimal && !activeItem.done }}">
              <span class="rounded-full bg-warn/25 px-3 py-1 text-sm font-semibold"><i class="bi bi-arrow-repeat me-1"></i>Probeer opnieuw</span>
            </template>
            <template type="if" if="{{ activeItem.done && !activeItem.optimal && activeItem.hasCorrectResponse }}">
              <span class="rounded-full bg-bad/15 px-3 py-1 text-sm font-semibold text-bad"><i class="bi bi-x-lg me-1"></i>Bekijk de uitleg</span>
            </template>
          </div>
        </template>
      </test-stamp>

      <test-stamp class="sticky bottom-0 -mx-4 mt-auto block">
        <template>
          <footer class="flex flex-wrap items-center justify-between gap-3 rounded-t-box bg-surface px-5 py-4 shadow-[0_-4px_20px_oklch(60%_0.05_250/0.18)]">
            <ol class="flex max-w-full items-center gap-1.5 overflow-x-auto py-1">
              <template type="repeat" repeat="{{ activeTestpart.items }}">
                <li title="{{ item.title }}" class="grid size-9 shrink-0 place-items-center rounded-full text-sm font-black {{ item.done ? (item.maxScore == null ? 'bg-line text-ink/50' : item.optimal ? 'bg-good text-white' : 'bg-bad text-white') : item.active ? 'bg-brand text-on-brand ring-4 ring-brand/25' : 'bg-line text-ink/50' }}">{{ item.done ? (item.maxScore == null ? '•' : item.optimal ? '✓' : '✕') : item.index }}</li>
              </template>
            </ol>
            <div class="flex flex-wrap items-center gap-2">
              <button class="cursor-pointer rounded-field px-3 py-2 text-sm font-semibold hover:bg-page" onclick="document.querySelector('#results').showModal()"><i class="bi bi-flag me-1"></i>Overzicht</button>
            </div>
          </footer>
        </template>
      </test-stamp>

      <!-- Overzicht: statistics from the state of the test (the stamp context), no code. A full report comes later. -->
      <dialog id="results" class="m-auto w-[min(40rem,calc(100vw-2rem))] rounded-box bg-surface p-0 text-ink shadow-2xl backdrop:bg-black/50">
        <div class="flex max-h-[85vh] flex-col gap-5 overflow-y-auto p-6">
          <h2 class="text-xl font-bold">Overzicht</h2>
          <test-stamp>
            <template>
              <div class="grid grid-cols-3 gap-3 text-center">
                <div class="rounded-field bg-page p-3">
                  <p class="text-2xl font-bold tabular-nums">{{ activeTestpart.items.filter((i) => i.index && (i.numAttempts > 0 || i.completionStatus == 'completed')).length }} / {{ activeTestpart.items.filter((i) => i.index).length }}</p>
                  <p class="text-sm text-ink/60">beantwoord</p>
                </div>
                <div class="rounded-field bg-page p-3">
                  <p class="text-2xl font-bold tabular-nums">{{ activeTestpart.items.filter((i) => i.maxScore > 0 && i.score >= i.maxScore).length }}</p>
                  <p class="text-sm text-ink/60">helemaal goed</p>
                </div>
                <div class="rounded-field bg-page p-3">
                  <p class="text-2xl font-bold tabular-nums">{{ activeTestpart.items.reduce((sum, i) => sum + (i.maxScore == null ? 0 : i.score || 0), 0) }} / {{ activeTestpart.items.reduce((sum, i) => sum + (i.maxScore == null ? 0 : i.maxScore), 0) }}</p>
                  <p class="text-sm text-ink/60">punten</p>
                </div>
              </div>

              <table class="w-full text-left text-sm">
                <thead><tr class="border-b border-line text-ink/60"><th class="py-2 pr-3 font-medium">#</th><th class="py-2 pr-3 font-medium">Vraag</th><th class="py-2 pr-3 font-medium">Antwoord</th></tr></thead>
                <tbody>
                  <template type="repeat" repeat="{{ activeTestpart.items.filter((i) => !(i.categories || []).some((c) => c == 'dep-informational' || c == 'unscored')) }}">
                    <tr class="border-b border-line/60">
                      <td class="py-2 pr-3 tabular-nums">{{ item.index }}</td>
                      <td class="py-2 pr-3">{{ item.title || item.identifier }}</td>
                      <td class="py-2 pr-3">
                        <span class="rounded-full px-2 py-0.5 text-xs font-semibold {{ !(item.numAttempts > 0 || item.completionStatus == 'completed') ? 'bg-line text-ink/60' : item.maxScore > 0 && item.score >= item.maxScore ? 'bg-good/15 text-good' : item.score > 0 ? 'bg-warn/25 text-ink' : 'bg-bad/15 text-bad' }}">
                          {{ !(item.numAttempts > 0 || item.completionStatus == 'completed') ? 'niet ingevuld' : item.maxScore > 0 && item.score >= item.maxScore ? 'goed' : item.score > 0 ? 'deels goed' : 'fout' }}
                        </span>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </template>
          </test-stamp>
          <div class="flex justify-end gap-2">
            <button class="cursor-pointer rounded-field px-4 py-2 font-medium hover:bg-page" onclick="sessionStorage.removeItem('formatief'); history.replaceState(null, '', location.pathname); location.reload()"><i class="bi bi-arrow-counterclockwise me-1"></i>Opnieuw</button>
            <form method="dialog"><button class="cursor-pointer rounded-field bg-brand px-4 py-2 font-semibold text-on-brand hover:opacity-90">Sluiten</button></form>
          </div>
        </div>
      </dialog>
    </test-navigation>
  </qti-test>
</body>

</html>
