# A single-package workspace; older pnpm (e.g. on StackBlitz) rejects this file without `packages`.
packages:
  - '.'
# Dependencies whose install scripts may run (pnpm 11 fails the install on unapproved ones).
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@citolab/qti-components@9.2.0 || 9.3.0 || 9.5.0 || 10.0.0-next.2 || 10.0.0-next.3'
